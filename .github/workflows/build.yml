name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets (see README → Building)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KIDSTUBE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        run: gradle :app:assembleRelease --no-daemon
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KIDSTUBE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk KidsTube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KidsTube
          path: KidsTube.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          MSG=$(git log -1 --pretty=%s)
          gh release delete latest --yes --cleanup-tag || true
          # The app's updater reads "versionCode: N" from the notes and downloads the .apk asset.
          gh release create latest KidsTube.apk \
            --title "KidsTube 1.7.${{ github.run_number }}" \
            --notes "$(printf 'versionCode: %s\n\n%s\n\nBuilt from commit %s' "$CODE" "$MSG" "${{ github.sha }}")" \
            --target ${{ github.sha }} \
            --latest
