name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: gradle :app:assembleRelease --no-daemon
        env:
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk KidsTube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KidsTube
          path: KidsTube.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$((100 + ${{ github.run_number }}))
          MSG=$(git log -1 --pretty=%s)
          gh release delete latest --yes --cleanup-tag || true
          # The app's updater reads "versionCode: N" from the notes and downloads the .apk asset.
          gh release create latest KidsTube.apk \
            --title "KidsTube 1.3.${{ github.run_number }}" \
            --notes "$(printf 'versionCode: %s\n\n%s\n\nСборка из коммита %s' "$CODE" "$MSG" "${{ github.sha }}")" \
            --target ${{ github.sha }} \
            --latest
