name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

# Never run two builds at once: they would race to replace the "latest" release.
concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64 and KEYSTORE_PASSWORD repository secrets (see README → Building)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KIDSTUBE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Read the version
        run: |
          NAME=$(grep -E '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          IFS=. read -r MA MI PA <<< "$NAME"
          CODE=$((MA * 10000 + MI * 100 + PA))
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Version $NAME (versionCode $CODE)"

      - name: Build
        run: gradle :app:assembleRelease --no-daemon
        env:
          KIDSTUBE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk KidsTube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: KidsTube-${{ env.VERSION_NAME }}
          path: KidsTube.apk

      # A release is published only when version.properties was bumped: pushes that keep the
      # version (docs, refactoring) are built and checked, but don't replace the release.
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(gh release view latest --json body --jq .body 2>/dev/null | grep -oE 'versionCode: *[0-9]+' | grep -oE '[0-9]+' || echo 0)
          if [ "$VERSION_CODE" -le "${PREV:-0}" ]; then
            echo "::notice::Version $VERSION_NAME ($VERSION_CODE) is not newer than the published release ($PREV) — not publishing. Bump version.properties to release."
            exit 0
          fi
          MSG=$(git log -1 --pretty=%s)
          gh release delete latest --yes --cleanup-tag || true
          # The app's updater reads "versionCode: N" from the notes and downloads the .apk asset.
          gh release create latest KidsTube.apk \
            --title "KidsTube $VERSION_NAME" \
            --notes "$(printf 'versionCode: %s\n\n%s\n\nBuilt from commit %s' "$VERSION_CODE" "$MSG" "${{ github.sha }}")" \
            --target ${{ github.sha }} \
            --latest
