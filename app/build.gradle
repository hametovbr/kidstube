plugins {
    id 'com.android.application'
}

// Version: the only source is version.properties (see AGENTS.md → Versioning).
def versionProps = new Properties()
file('../version.properties').withInputStream { versionProps.load(it) }
def appVersionName = versionProps.getProperty('VERSION_NAME').trim()
def versionParts = appVersionName.tokenize('.').collect { it as int }
if (versionParts.size() != 3 || versionParts[1] > 99 || versionParts[2] > 99) {
    throw new GradleException("VERSION_NAME must be MAJOR.MINOR.PATCH with MINOR and PATCH below 100, got ${appVersionName}")
}
def appVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

android {
    namespace 'app.kidstube.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.kidstube.tv'
        minSdk 21
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    // Release builds are signed with the private key kept in GitHub Actions secrets
    // (KEYSTORE_BASE64 / KEYSTORE_PASSWORD). Without it, local builds use the debug key.
    def releaseKeystore = System.getenv('KIDSTUBE_KEYSTORE')

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('KIDSTUBE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KIDSTUBE_KEY_ALIAS') ?: 'kidstube'
                keyPassword System.getenv('KIDSTUBE_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
