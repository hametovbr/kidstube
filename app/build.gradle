plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('BUILD_NUMBER') ?: '0') as int

android {
    namespace 'app.kidstube.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.kidstube.tv'
        minSdk 21
        targetSdk 34
        // CI builds always get a higher version so they install over older ones.
        versionCode 100 + buildNumber
        versionName "1.4.${buildNumber}"
    }

    // Release builds are signed with the private key kept in GitHub Actions secrets
    // (KEYSTORE_BASE64 / KEYSTORE_PASSWORD). Without it, local builds use the debug key.
    def releaseKeystore = System.getenv('KIDSTUBE_KEYSTORE')

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('KIDSTUBE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('KIDSTUBE_KEY_ALIAS') ?: 'kidstube'
                keyPassword System.getenv('KIDSTUBE_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
