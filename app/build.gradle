plugins {
    id 'com.android.application'
}

def buildNumber = (System.getenv('BUILD_NUMBER') ?: '0') as int

android {
    namespace 'app.kidstube.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.kidstube.tv'
        minSdk 21
        targetSdk 34
        // CI builds always get a higher version so they install over older ones.
        versionCode 100 + buildNumber
        versionName "1.3.${buildNumber}"
    }

    signingConfigs {
        // One shared key for every build, so updates install over the previous version.
        shared {
            storeFile file('kidstube.keystore')
            storePassword 'kidstube'
            keyAlias 'kidstube'
            keyPassword 'kidstube'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
