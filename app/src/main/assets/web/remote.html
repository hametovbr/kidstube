<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KidsTube</title>
<style>
  :root { --bg: #f5f6fa; --card: #fff; --text: #1b2030; --muted: #6b7489; --accent: #ff6b57; --line: #e3e6ee; --ok: #2fbf7f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1420; --card: #1a2235; --text: #f1f3f8; --muted: #9aa6c2; --line: #2a3450; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 20px 16px 120px; }
  h1 { font-size: 24px; margin: 8px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 14px; border: 1px solid var(--line); }
  .card h2 { font-size: 17px; margin: 0 0 12px; }
  label { display: block; font-weight: 600; margin: 12px 0 6px; }
  label:first-of-type { margin-top: 0; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 4px; }
  input[type=text], input[type=password], textarea { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font: inherit; }
  textarea { min-height: 96px; resize: vertical; }
  .check { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-weight: 500; margin: 0; }
  .check:first-of-type { border-top: 0; }
  .check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 13px 18px; background: var(--accent); color: #fff; width: 100%; cursor: pointer; }
  button:disabled { opacity: .6; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
  .bar .in { max-width: 640px; margin: 0 auto; }
  .msg { padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; display: none; }
  .msg.err { display: block; background: #ffe3df; color: #9b2414; }
  .msg.ok { display: block; background: #dff7ea; color: #13643f; }
  .hidden { display: none; }
  a { color: var(--accent); }
  ol { padding-left: 20px; margin: 6px 0 0; }
  .hist { display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); align-items: flex-start; }
  .hist:first-child { border-top: 0; }
  .hist img { width: 96px; height: 54px; object-fit: cover; border-radius: 8px; flex: none; background: var(--line); }
  .hist .t { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .hist .m { color: var(--muted); font-size: 12px; margin: 2px 0 6px; }
  .hist .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .mini { width: auto; padding: 5px 10px; font-size: 12px; border-radius: 8px; background: var(--line); color: var(--text); font-weight: 600; }
  .mini.done { background: var(--ok); color: #fff; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab { background: var(--card); color: var(--text); border: 1px solid var(--line); width: auto; flex: 1 1 0; min-width: 0; padding: 10px 6px; font-size: 14px; line-height: 1.2; }
  html, body { overflow-x: hidden; }
  .tab.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .kv { display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--line); }
  .kv:first-of-type { border-top: 0; }
  .kv span { color: var(--muted); }
  button.secondary { background: var(--line); color: var(--text); }
  .lang { display: flex; gap: 6px; float: right; margin-top: 10px; }
  .lang button { width: auto; padding: 6px 10px; font-size: 13px; background: var(--card); color: var(--text); border: 1px solid var(--line); }
  .lang button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="lang"><button data-lang="en">EN</button><button data-lang="ru">RU</button></div>
  <h1>KidsTube</h1>
  <p class="sub" data-i="sub"></p>
  <div id="msg" class="msg"></div>

  <!-- Login -->
  <div id="login" class="card">
    <h2 data-i="login"></h2>
    <label for="loginPin" data-i="parentPin"></label>
    <input id="loginPin" type="password" inputmode="numeric" autocomplete="off" data-ph="loginPh">
    <div style="height:14px"></div>
    <button id="loginBtn" data-i="signIn"></button>
  </div>

  <div class="tabs hidden" id="tabs">
    <button class="tab on" data-tab="form" data-i="tabSettings"></button>
    <button class="tab" data-tab="history" data-i="tabHistory"></button>
    <button class="tab" data-tab="app" data-i="tabApp"></button>
  </div>

  <!-- App: version, updates, maintenance -->
  <div id="app" class="hidden">
    <div class="card">
      <h2 data-i="appTitle"></h2>
      <div class="kv"><span data-i="version"></span><b id="appVersion">—</b></div>
      <div class="kv"><span data-i="quota"></span><b id="appQuota">—</b></div>
      <div class="kv"><span data-i="histCount"></span><b id="appHist">—</b></div>
    </div>
    <div class="card">
      <h2 data-i="updates"></h2>
      <div class="hint" id="updText" data-i="updHint"></div>
      <div style="height:10px"></div>
      <button id="updCheck" data-i="checkUpd"></button>
      <div style="height:8px"></div>
      <button id="updInstall" class="hidden" data-i="installUpd"></button>
    </div>
    <div class="card">
      <h2 data-i="maintenance"></h2>
      <button id="clrHistory" class="secondary" data-i="clearHistory"></button>
      <div class="hint" data-i="clearHistoryHint"></div>
      <div style="height:12px"></div>
      <button id="clrCache" class="secondary" data-i="clearCache"></button>
      <div class="hint" data-i="clearCacheHint"></div>
    </div>
  </div>

  <!-- History -->
  <div id="history" class="hidden">
    <div class="card">
      <h2 data-i="histTitle"></h2>
      <div class="hint" style="margin:-6px 0 8px" data-i="histHint"></div>
      <div id="histList"></div>
    </div>
  </div>

  <!-- Form -->
  <div id="form" class="hidden">
    <div class="card">
      <h2 data-i="access"></h2>
      <label data-i="language"></label>
      <div class="lang-pick" style="display:flex;gap:8px">
        <label class="check" style="border:0;padding:4px 0"><input type="radio" name="tvlang" value="en"> English</label>
        <label class="check" style="border:0;padding:4px 0"><input type="radio" name="tvlang" value="ru"> Русский</label>
      </div>
      <label for="apiKey" data-i="apiKey"></label>
      <input id="apiKey" type="text" autocomplete="off" spellcheck="false" placeholder="AIzaSy…">
      <div class="hint"><span data-i="howTo"></span><ol>
        <li data-i="how1"></li><li data-i="how2"></li><li data-i="how3"></li></ol></div>
      <label for="pin" data-i="pinLabel"></label>
      <input id="pin" type="text" inputmode="numeric" autocomplete="off" maxlength="8">
      <div class="hint" data-i="pinHint"></div>
    </div>

    <div class="card">
      <h2 data-i="whatBlock"></h2>
      <label for="blockedWords" data-i="words"></label>
      <textarea id="blockedWords" data-ph="wordsPh"></textarea>
      <div class="hint" data-i="wordsHint"></div>
      <label for="blockedChannels" data-i="channels"></label>
      <textarea id="blockedChannels" data-ph="channelsPh"></textarea>
      <label for="blockedVideos" data-i="videos"></label>
      <textarea id="blockedVideos" placeholder="https://youtu.be/xxxxxxxxxxx"></textarea>
    </div>

    <div class="card">
      <h2 data-i="where"></h2>
      <label class="check"><input type="checkbox" id="checkTitle"> <span data-i="inTitle"></span></label>
      <label class="check"><input type="checkbox" id="checkTags"> <span data-i="inTags"></span></label>
      <label class="check"><input type="checkbox" id="checkDescription"> <span data-i="inDesc"></span></label>
      <label class="check"><input type="checkbox" id="checkChannel"> <span data-i="inChannel"></span></label>
    </div>

    <div class="card">
      <h2 data-i="extra"></h2>
      <label class="check"><input type="checkbox" id="onlyKids"> <span data-i="onlyKids"></span></label>
      <label class="check"><input type="checkbox" id="hideShort"> <span data-i="hideShort"></span></label>
      <label class="check"><input type="checkbox" id="autoplayNext"> <span data-i="autoplay"></span></label>
    </div>

    <div class="card">
      <h2 data-i="homeScreen"></h2>
      <label for="homeChannels" data-i="subs"></label>
      <textarea id="homeChannels" placeholder="@channel&#10;https://www.youtube.com/@channel"></textarea>
      <div class="hint" data-i="subsHint"></div>
      <label for="homeQueries" data-i="queries"></label>
      <textarea id="homeQueries" data-ph="queriesPh"></textarea>
      <div class="hint" data-i="queriesHint"></div>
    </div>
  </div>
</div>

<div class="bar hidden" id="bar"><div class="in"><button id="saveBtn" data-i="save"></button></div></div>

<script>
(function () {
  var STR = {
    en: {
      sub: 'Parental controls for the TV', login: 'Sign in', parentPin: 'Parent PIN', loginPh: 'Leave empty if no PIN is set yet', signIn: 'Sign in',
      tabSettings: 'Settings', tabHistory: 'Watch history', tabApp: 'App',
      appTitle: 'KidsTube on the TV', version: 'Version', quota: 'API quota used today', histCount: 'Videos in the history',
      updates: 'Updates', updHint: 'Check GitHub for a new version.', checkUpd: 'Check for updates', installUpd: 'Install on the TV',
      updChecking: 'Checking…', updAvailable: 'New version available: {0}. Installed: {1}.', updLatest: 'You have the latest version ({0}).',
      updStarted: 'Download started on the TV. Confirm the installation on the TV screen with the remote.',
      maintenance: 'Maintenance', clearHistory: 'Clear watch history', clearHistoryHint: 'Removes “Watched”, “Watch again” and the history on this page.',
      clearCache: 'Clear cache', clearCacheHint: 'Search results and channel lists will be loaded again.',
      confirmHistory: 'Clear the whole watch history?', done: 'Done ✓',
      histTitle: 'What your child watched', histHint: 'You can block a video or channel right here — then press “Save”.',
      loading: 'Loading…', histEmpty: 'Nothing watched yet.', histFail: 'Could not load the history.',
      watchedTimes: 'watched {0} times', blockVideo: '🚫 Video', blockChannel: '🚫 Channel', videoListed: '✓ Video listed', channelListed: '✓ Channel listed', open: 'Open',
      access: 'Access', language: 'TV language', apiKey: 'YouTube Data API key', howTo: 'How to get one:',
      how1: 'console.cloud.google.com → new project', how2: '“APIs & Services” → “Library” → YouTube Data API v3 → “Enable”', how3: '“Credentials” → “Create credentials” → “API key”',
      pinLabel: 'Parent PIN (4–8 digits)', pinHint: 'Needed for the settings and the parent menu on the TV (long-press OK on a video).',
      whatBlock: 'What to block', words: 'Blocked words and phrases — one per line', wordsPh: 'scary\nhuggy wuggy\n#prank',
      wordsHint: 'Case doesn’t matter. Parts of words work too: “scar” hides “scary” and “scarecrow”.',
      channels: 'Blocked channels — one per line', channelsPh: '@channelname\nhttps://www.youtube.com/@channel\nExact channel name', videos: 'Blocked videos — links or IDs',
      where: 'Where to look for the words', inTitle: 'In the video title', inTags: 'In the tags', inDesc: 'In the description', inChannel: 'In the channel name',
      extra: 'More', onlyKids: 'Only videos marked “made for kids” by YouTube', hideShort: 'Hide very short videos (under 1 minute)', autoplay: 'Play the next video automatically',
      homeScreen: 'Home screen', subs: 'Subscriptions — channels whose new videos appear on Home (one per line)',
      subsHint: 'Use the channel’s @handle or a link to it. Channel videos are filtered too.',
      queries: 'Collections by search query — one per line', queriesPh: 'kids songs\nlearning cartoons',
      queriesHint: 'Each collection is one search; the result is kept for 6 hours.',
      save: 'Save to the TV', error: 'Error', pinFormat: 'The PIN must be 4–8 digits', needKey: 'Enter the YouTube API key',
      saved: 'Saved — the TV has already applied the settings ✓', noTv: 'Can’t reach the TV. The KidsTube app must be open.'
    },
    ru: {
      sub: 'Настройки родительского контроля на телевизоре', login: 'Вход', parentPin: 'PIN родителя', loginPh: 'Если PIN ещё не задан — оставьте пустым', signIn: 'Войти',
      tabSettings: 'Настройки', tabHistory: 'История просмотров', tabApp: 'Приложение',
      appTitle: 'KidsTube на телевизоре', version: 'Версия', quota: 'Квота API за сегодня', histCount: 'Видео в истории',
      updates: 'Обновления', updHint: 'Проверить новую версию на GitHub.', checkUpd: 'Проверить обновления', installUpd: 'Установить на телевизор',
      updChecking: 'Проверяю…', updAvailable: 'Доступна новая версия: {0}. Сейчас установлена {1}.', updLatest: 'Установлена последняя версия ({0}).',
      updStarted: 'Загрузка началась на телевизоре. Подтвердите установку на экране ТВ пультом.',
      maintenance: 'Обслуживание', clearHistory: 'Очистить историю просмотров', clearHistoryHint: 'Удалит «Я смотрел», «Смотреть снова» и историю на этой странице.',
      clearCache: 'Очистить кэш', clearCacheHint: 'Результаты поиска и списки каналов загрузятся заново.',
      confirmHistory: 'Очистить всю историю просмотров?', done: 'Готово ✓',
      histTitle: 'Что смотрел ребёнок', histHint: 'Можно сразу заблокировать видео или канал — затем нажмите «Сохранить».',
      loading: 'Загрузка…', histEmpty: 'Пока ничего не смотрели.', histFail: 'Не удалось загрузить историю.',
      watchedTimes: 'смотрел {0} раз', blockVideo: '🚫 Видео', blockChannel: '🚫 Канал', videoListed: '✓ Видео в списке', channelListed: '✓ Канал в списке', open: 'Открыть',
      access: 'Доступ', language: 'Язык на телевизоре', apiKey: 'Ключ YouTube Data API', howTo: 'Как получить:',
      how1: 'console.cloud.google.com → новый проект', how2: '«API и сервисы» → «Библиотека» → YouTube Data API v3 → «Включить»', how3: '«Учётные данные» → «Создать» → «Ключ API»',
      pinLabel: 'PIN родителя (4–8 цифр)', pinHint: 'Нужен для настроек и родительского меню на ТВ (долгое нажатие OK на видео).',
      whatBlock: 'Что блокировать', words: 'Запрещённые слова и фразы — по одному в строке', wordsPh: 'страшилки\nхаги ваги\n#prank',
      wordsHint: 'Регистр не важен, «ё» = «е». Срабатывает и часть слова: «страш» скроет «страшный» и «страшилки».',
      channels: 'Заблокированные каналы — по одному в строке', channelsPh: '@channelname\nhttps://www.youtube.com/@channel\nТочное название канала', videos: 'Заблокированные видео — ссылки или ID',
      where: 'Где искать слова', inTitle: 'В названии видео', inTags: 'В тегах', inDesc: 'В описании', inChannel: 'В названии канала',
      extra: 'Дополнительно', onlyKids: 'Только видео с пометкой YouTube «для детей»', hideShort: 'Скрывать очень короткие видео (до 1 минуты)', autoplay: 'Автоматически включать следующее видео',
      homeScreen: 'Главный экран', subs: 'Подписки — каналы, новые видео которых показываются на главной (по одному в строке)',
      subsHint: 'Указывайте @имя канала или ссылку на него. Видео каналов тоже проходят фильтр.',
      queries: 'Подборки по запросам — по одному в строке', queriesPh: 'песенки для детей\nразвивающие мультики',
      queriesHint: 'Каждая подборка — один поиск, результат хранится 6 часов.',
      save: 'Сохранить на телевизор', error: 'Ошибка', pinFormat: 'PIN должен состоять из 4–8 цифр', needKey: 'Укажите ключ YouTube API',
      saved: 'Сохранено — телевизор уже применил настройки ✓', noTv: 'Нет связи с телевизором. Приложение KidsTube должно быть открыто.'
    }
  };
  var lang = /^ru/i.test(navigator.language || '') ? 'ru' : 'en';
  function t(k, a, b) { var v = (STR[lang][k] || STR.en[k] || k); return v.replace('{0}', a === undefined ? '' : a).replace('{1}', b === undefined ? '' : b); }
  function applyLang(l) {
    lang = STR[l] ? l : 'en';
    document.documentElement.lang = lang;
    Array.prototype.forEach.call(document.querySelectorAll('[data-i]'), function (el) { el.textContent = t(el.getAttribute('data-i')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-ph]'), function (el) { el.placeholder = t(el.getAttribute('data-ph')); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) { b.classList.toggle('on', b.getAttribute('data-lang') === lang); });
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-lang]'), function (b) {
    b.onclick = function () { applyLang(b.getAttribute('data-lang')); if (!$('history').classList.contains('hidden')) loadHistory(); };
  });

  var LISTS = ['blockedWords', 'blockedChannels', 'blockedVideos', 'homeChannels', 'homeQueries'];
  var BOOLS = { checkTitle: true, checkTags: true, checkDescription: false, checkChannel: true, onlyKids: true, hideShort: false, autoplayNext: true };
  var pin = '';
  var current = {};

  function $(id) { return document.getElementById(id); }
  function msg(text, ok) {
    var m = $('msg');
    m.textContent = text || '';
    m.className = 'msg' + (text ? (ok ? ' ok' : ' err') : '');
    if (text) window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function post(path, body) {
    return fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); });
  }
  function lines(v) { return v.split(/[\n,;]+/).map(function (x) { return x.trim(); }).filter(Boolean); }

  function fill(s) {
    current = s || {};
    $('apiKey').value = s.apiKey || '';
    $('pin').value = s.pin || '';
    var tvLang = s.lang === 'ru' ? 'ru' : 'en';
    Array.prototype.forEach.call(document.querySelectorAll('input[name=tvlang]'), function (r) { r.checked = r.value === tvLang; });
    LISTS.forEach(function (k) { $(k).value = (s[k] || []).join('\n'); });
    Object.keys(BOOLS).forEach(function (k) { $(k).checked = s.hasOwnProperty(k) ? !!s[k] : BOOLS[k]; });
  }

  $('loginBtn').onclick = function () {
    var p = $('loginPin').value.trim();
    $('loginBtn').disabled = true;
    post('/api/login', { pin: p }).then(function (r) {
      if (!r.ok) { msg(r.error || t('error')); return; }
      pin = p;
      msg('');
      fill(r.settings || {});
      if (r.settings && r.settings.lang) applyLang(r.settings.lang);
      $('login').classList.add('hidden');
      $('form').classList.remove('hidden');
      $('tabs').classList.remove('hidden');
      $('bar').classList.remove('hidden');
    }).catch(function () { msg(t('noTv')); })
      .then(function () { $('loginBtn').disabled = false; });
  };
  $('loginPin').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('loginBtn').onclick(); });

  // ---- Tabs & history ----
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (tb) {
    tb.onclick = function () {
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (x) { x.classList.toggle('on', x === tb); });
      var tab = tb.getAttribute('data-tab');
      $('form').classList.toggle('hidden', tab !== 'form');
      $('history').classList.toggle('hidden', tab !== 'history');
      $('app').classList.toggle('hidden', tab !== 'app');
      $('bar').classList.toggle('hidden', tab === 'app');
      if (tab === 'history') loadHistory();
      if (tab === 'app') loadStatus();
    };
  });

  function fmtDate(ms) {
    var d = new Date(ms);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getDate()) + '.' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function appendLine(id, line) {
    var cur = lines($(id).value);
    if (cur.indexOf(line) < 0) cur.push(line);
    $(id).value = cur.join('\n');
  }

  function hint(text) { var d = document.createElement('div'); d.className = 'hint'; d.textContent = text; return d; }

  function loadHistory() {
    var box = $('histList');
    box.innerHTML = '';
    box.appendChild(hint(t('loading')));
    post('/api/history', { pin: pin }).then(function (r) {
      box.innerHTML = '';
      var list = (r && r.history) || [];
      if (!list.length) { box.appendChild(hint(t('histEmpty'))); return; }
      list.slice(0, 150).forEach(function (v) {
        var row = document.createElement('div'); row.className = 'hist';
        var img = document.createElement('img'); img.src = v.thumb || ''; img.loading = 'lazy'; row.appendChild(img);
        var info = document.createElement('div');
        var ti = document.createElement('div'); ti.className = 't'; ti.textContent = v.title; info.appendChild(ti);
        var m = document.createElement('div'); m.className = 'm';
        m.textContent = v.channelTitle + ' · ' + fmtDate(v.watchedAt) + (v.count > 1 ? ' · ' + t('watchedTimes', v.count) : '');
        info.appendChild(m);
        var acts = document.createElement('div'); acts.className = 'acts';
        var b1 = document.createElement('button'); b1.className = 'mini'; b1.textContent = t('blockVideo');
        b1.onclick = function () { appendLine('blockedVideos', 'https://youtu.be/' + v.id); b1.classList.add('done'); b1.textContent = t('videoListed'); };
        var b2 = document.createElement('button'); b2.className = 'mini'; b2.textContent = t('blockChannel');
        b2.onclick = function () { appendLine('blockedChannels', 'https://www.youtube.com/channel/' + v.channelId); b2.classList.add('done'); b2.textContent = t('channelListed'); };
        var a = document.createElement('a'); a.href = 'https://youtu.be/' + v.id; a.target = '_blank'; a.className = 'mini'; a.textContent = t('open'); a.style.textDecoration = 'none';
        acts.appendChild(b1); if (v.channelId) acts.appendChild(b2); acts.appendChild(a);
        info.appendChild(acts);
        row.appendChild(info);
        box.appendChild(row);
      });
    }).catch(function () { box.innerHTML = ''; box.appendChild(hint(t('histFail'))); });
  }

  // ---- App tab ----
  var upd = null;
  function loadStatus() {
    post('/api/app/status', { pin: pin }).then(function (r) {
      if (!r.ok) { msg(r.error || t('error')); return; }
      $('appVersion').textContent = r.version + ' (' + r.versionCode + ')';
      $('appQuota').textContent = (r.tv && r.tv.quotaUsed != null ? '~' + r.tv.quotaUsed : '0') + ' / 10 000';
      $('appHist').textContent = r.historyCount;
    }).catch(function () { msg(t('noTv')); });
  }
  $('updCheck').onclick = function () {
    $('updText').textContent = t('updChecking');
    $('updInstall').classList.add('hidden');
    post('/api/app/update-check', { pin: pin }).then(function (r) {
      if (!r.ok) { $('updText').textContent = r.error || t('error'); return; }
      upd = r.update;
      if (upd.available) {
        $('updText').textContent = t('updAvailable', upd.latestName || upd.latestCode, upd.currentName);
        $('updInstall').classList.remove('hidden');
      } else $('updText').textContent = t('updLatest', upd.currentName);
    }).catch(function () { msg(t('noTv')); });
  };
  $('updInstall').onclick = function () {
    post('/api/app/update-install', { pin: pin }).then(function (r) {
      $('updText').textContent = r.ok ? t('updStarted') : (r.error || t('error'));
      $('updInstall').classList.add('hidden');
    }).catch(function () { msg(t('noTv')); });
  };
  $('clrHistory').onclick = function () {
    if (!confirm(t('confirmHistory'))) return;
    post('/api/app/clear-history', { pin: pin }).then(function (r) {
      msg(r.ok ? t('done') : (r.error || t('error')), r.ok);
      loadStatus();
    }).catch(function () { msg(t('noTv')); });
  };
  $('clrCache').onclick = function () {
    post('/api/app/clear-cache', { pin: pin }).then(function (r) { msg(r.ok ? t('done') : (r.error || t('error')), r.ok); })
      .catch(function () { msg(t('noTv')); });
  };

  $('saveBtn').onclick = function () {
    var s = {};
    for (var k in current) s[k] = current[k];
    s.apiKey = $('apiKey').value.trim();
    s.pin = $('pin').value.trim();
    var picked = document.querySelector('input[name=tvlang]:checked');
    s.lang = picked ? picked.value : (current.lang || 'en');
    LISTS.forEach(function (k) { s[k] = lines($(k).value); });
    Object.keys(BOOLS).forEach(function (k) { s[k] = $(k).checked; });
    if (!/^\d{4,8}$/.test(s.pin)) { msg(t('pinFormat')); return; }
    if (!s.apiKey) { msg(t('needKey')); return; }
    $('saveBtn').disabled = true;
    post('/api/save', { pin: pin, settings: s }).then(function (r) {
      if (!r.ok) { msg(r.error || t('error')); return; }
      pin = s.pin;
      current = s;
      msg(t('saved'), true);
    }).catch(function () { msg(t('noTv')); })
      .then(function () { $('saveBtn').disabled = false; });
  };

  applyLang(lang);
})();
</script>
</body>
</html>
