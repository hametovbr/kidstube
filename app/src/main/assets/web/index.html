<!-- Side navigation (main sections) -->
<nav id="rail" class="rail">
  <div class="rail-logo"><svg class="logo-icon"><use href="#i-logo"/></svg><span class="rl">KidsTube</span></div>
  <div class="rail-items">
    <button class="rail-item f" data-section="search"><svg><use href="#i-search"/></svg><span class="rl" data-i18n="nav.search"></span></button>
    <button class="rail-item f" data-section="home"><svg><use href="#i-home"/></svg><span class="rl" data-i18n="nav.home"></span></button>
    <button class="rail-item f" data-section="mychannels"><svg><use href="#i-subs"/></svg><span class="rl" data-i18n="nav.channels"></span></button>
    <button class="rail-item f" data-section="library"><svg><use href="#i-history"/></svg><span class="rl" data-i18n="nav.watched"></span></button>
  </div>
  <button class="rail-item f parent" data-action="settings"><svg><use href="#i-gear"/></svg><span class="rl" data-i18n="nav.parents"></span></button>
</nav>

<!-- Home -->
<section id="home" class="layer section">
  <main class="scroller" id="homeRows"></main>
</section>

<!-- Search -->
<section id="search" class="layer section">
  <header class="search-head">
    <button class="mic-big f" data-action="voice" data-i18n-label="search.voice"><svg><use href="#i-mic"/></svg></button>
    <div class="search-field f" data-action="search-input">
      <svg><use href="#i-keyboard"/></svg>
      <input id="resultsSearch" type="text" data-i18n-ph="search.placeholder" autocomplete="off" enterkeyhint="search">
    </div>
  </header>
  <main class="scroller">
    <div id="searchIdle">
      <div class="chips-title" id="chipsTitle"></div>
      <div class="chips" id="searchChips"></div>
    </div>
    <div class="grid" id="resultsGrid"></div>
    <div class="status" id="resultsStatus"></div>
  </main>
</section>

<!-- My channels -->
<section id="mychannels" class="layer section">
  <main class="scroller">
    <h1 class="page-title" data-i18n="page.channels"></h1>
    <div class="grid chan-grid" id="mcGrid"></div>
    <div class="status" id="mcStatus"></div>
  </main>
</section>

<!-- Watched -->
<section id="library" class="layer section">
  <main class="scroller">
    <h1 class="page-title" data-i18n="page.watched"></h1>
    <div class="grid" id="libGrid"></div>
    <div class="status" id="libStatus"></div>
  </main>
</section>

<!-- Channel -->
<section id="channel" class="layer section">
  <header class="chan-head">
    <img class="chan-avatar" id="chanAvatar" alt="">
    <div class="chan-title" id="chanTitle"></div>
    <button class="btn f sub-btn" data-action="subscribe" id="chanSub"><svg><use href="#i-star"/></svg><span data-i18n="channel.subscribe"></span></button>
  </header>
  <main class="scroller"><div class="grid" id="chanGrid"></div><div class="status" id="chanStatus"></div></main>
</section>

<!-- Player -->
<section id="player" class="layer">
  <div class="yt-wrap"><div id="yt"></div></div>
  <div class="osd" id="osd">
    <div class="osd-top"><div class="osd-title" id="osdTitle"></div><div class="osd-ch" id="osdChannel"></div></div>
    <div class="osd-center" id="osdIcon"></div>
    <div class="osd-bottom">
      <div class="bar"><div class="bar-fill" id="osdBar"><span class="bar-knob"></span></div></div>
      <div class="osd-times"><span id="osdTime">0:00</span><span id="osdDur">0:00</span></div>
      <div class="osd-hints">
        <span><b>OK</b><i data-i18n="player.hintOk"></i></span><span><b><svg><use href="#i-chev-l"/></svg><svg><use href="#i-chev-r"/></svg></b><i data-i18n="player.hintSeek"></i></span><span><b><svg><use href="#i-down"/></svg></b><i data-i18n="player.hintDown"></i></span><span><b data-i18n="player.back"></b><i data-i18n="player.hintBack"></i></span>
      </div>
    </div>
  </div>
  <div class="player-msg" id="playerMsg"></div>
  <div class="rel-panel scroller" id="relPanel">
    <div class="rel-actions">
      <button class="btn primary f" data-action="rel-close"><svg><use href="#i-play"/></svg><span data-i18n="rel.continue"></span></button>
      <button class="btn f chan-btn" data-action="rel-channel" id="relChannelBtn"></button>
    </div>
    <div id="relRows"></div>
  </div>
</section>

<!-- First run -->
<section id="setup" class="layer">
  <div class="setup-box">
    <div class="setup-logo"><svg class="logo-icon"><use href="#i-logo"/></svg>KidsTube</div>
    <h1 data-i18n="setup.title"></h1>
    <div class="qr-row">
      <div class="qr" id="setupQr"></div>
      <div>
        <p data-i18n="setup.open"></p>
        <div class="url" id="setupUrl"></div>
        <p class="muted" data-i18n="setup.what"></p>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn f" data-action="settings-direct" data-i18n="setup.onTv"></button>
    </div>
  </div>
</section>

<!-- Settings (TV) -->
<section id="settings" class="layer">
  <main class="scroller settings-scroller">
    <h1 class="page-title" data-i18n="set.title"></h1>
    <div class="remote-hint">
      <div class="qr" id="settingsQr"></div>
      <div><p data-i18n="set.phone"></p><div class="url" id="settingsUrl"></div><p class="muted" id="quotaInfo"></p></div>
    </div>
    <div class="update-box">
      <div><div class="section-title" data-i18n="set.updates"></div><div class="muted" id="updInfo" data-i18n="set.updHint"></div></div>
      <div class="btn-row upd-btns">
        <button class="btn f" data-action="upd-check" data-i18n="set.check"></button>
        <button class="btn primary f" id="updInstall" data-action="upd-install" style="display:none" data-i18n="set.install"></button>
      </div>
    </div>
    <div class="form" id="settingsForm"></div>
    <div class="btn-row">
      <button class="btn primary f" data-action="settings-save" data-i18n="set.save"></button>
      <button class="btn f" data-action="back" data-i18n="cancel"></button>
      <button class="btn f" data-action="clear-cache" data-i18n="set.clearCache"></button>
      <button class="btn f" data-action="clear-history" data-i18n="set.clearHistory"></button>
    </div>
  </main>
</section>

<!-- PIN dialog -->
<section id="pin" class="layer dialog">
  <div class="dialog-box">
    <h2 id="pinTitle" data-i18n="pin.title"></h2>
    <input id="pinInput" class="f pin-input" type="password" inputmode="numeric" maxlength="8" autocomplete="off" data-action="pin-input">
    <div class="pin-err" id="pinErr"></div>
    <div class="btn-row">
      <button class="btn primary f" data-action="pin-ok" data-i18n="ok"></button>
      <button class="btn f" data-action="back" data-i18n="cancel"></button>
    </div>
  </div>
</section>

<!-- Parent menu for a video -->
<section id="menu" class="layer dialog">
  <div class="dialog-box">
    <h2 id="menuTitle"></h2>
    <div class="menu-list" id="menuList"></div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script src="qrcode.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
